<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จอใหญ่ — BEN ♥ MEGH</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="big">
  <iframe id="vid" allow="autoplay; fullscreen" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe>
  <div id="empty" class="hidden" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg)">
    <img src="img/illustration.jpg" alt="" style="width:320px;height:320px;border-radius:50%;object-fit:cover;border:8px solid #fff">
    <p class="display" style="font-size:40px;margin:0">ฝากคำอวยพรได้ที่บูธ iPad</p>
  </div>
  <div class="logo">BEN ♥ MEGH</div>
  <div class="qr">
    <div id="qr" role="img" aria-label="QR อัลบั้มคำอวยพร"></div>
    <span>สแกนดูอัลบั้ม<br>คำอวยพรบนมือถือ</span>
  </div>
  <!-- ข้อ 57: คำอวยพรแบบซับไตเติล กลางจอด้านล่าง เหนือแผงควบคุม Drive สูงสุด 3 บรรทัด -->
  <div id="msg" class="hidden" style="position:absolute;left:50%;transform:translateX(-50%);bottom:140px;max-width:56%;background:rgba(0,0,0,.6);color:#fff;padding:12px 24px;border-radius:16px;font-size:30px;line-height:1.45;font-weight:600;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line"></div>
  <!-- ยกขึ้นพ้นแถบควบคุมของ Drive · ไม่แสดง #BMWedding บนหน้า เพราะติดในคลิปแล้ว (ข้อ 51) -->
  <div class="foot" style="bottom:140px">
    <div class="pill" id="counter">คำอวยพรจากแขกในงาน</div>
  </div>
  <div class="start" id="start">
    <button class="btn lg" id="btnPlay" type="button">เริ่มฉาย (กดครั้งเดียว)</button>
  </div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  $('qr').innerHTML = App.qrSvg(App.albumUrl(), 5);
  let list = [], idx = 0, seen = new Set(), fresh = [];

  async function refresh() {
    try {
      const r = await App.apiGet({ action: 'slides' });
      if (!r.ok) return;
      r.items.forEach(it => { if (!seen.has(it.id) && list.length) fresh.push(it); seen.add(it.id); });
      list = r.items.slice().reverse(); // เก่าก่อน ใหม่ทีหลัง
      if (!list.length) $('empty').classList.remove('hidden');
    } catch (e) { /* เน็ตสะดุด ลองรอบหน้า */ }
  }

  function next() {
    if (!list.length) { setTimeout(next, 10000); return; }
    $('empty').classList.add('hidden');
    const it = fresh.length ? fresh.shift() : list[idx++ % list.length]; // คลิปใหม่แทรกคิวก่อน
    const pos = list.findIndex(x => x.id === it.id) + 1;
    $('counter').textContent = 'คำอวยพรจากแขกในงาน · ' + pos + ' / ' + list.length;
    const m = String(it.message || '').trim();
    $('msg').textContent = m; $('msg').classList.toggle('hidden', !m);
    // ข้อ 51: ใช้ตัวเล่นของ Drive (iframe) แทน <video> ที่โดน CORB บล็อก — ใช้บน Safari
    // ข้อ 52: แสดงคลิปละ SHOW_SEC วิ นับหลังตัวเล่น Drive โหลดเสร็จ (iframe load)
    // ถ้าโหลดไม่เสร็จใน LOAD_MAX_SEC วิ -> ข้ามไปคลิปถัดไป
    clearTimeout(timer);
    const f = $('vid');
    f.onload = () => { clearTimeout(timer); timer = setTimeout(next, SHOW_SEC * 1000); };
    f.src = it.previewUrl + '?autoplay=1';
    timer = setTimeout(next, LOAD_MAX_SEC * 1000);
  }
  const SHOW_SEC = 10, LOAD_MAX_SEC = 20; // ข้อ 55: 10 วิ (เดิม 5)
  let timer = 0;

  $('btnPlay').addEventListener('click', async () => {
    $('start').classList.add('hidden');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    await refresh();
    next();
    setInterval(refresh, 60000);
  });
})();
</script>
</body>
</html>
