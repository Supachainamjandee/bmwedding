<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จอใหญ่ — BEN ♥ MEGH</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ข้อ 67: จอแนวตั้ง 1080x1920 · ออกแบบที่ 1080x1920 แล้วย่อ/ขยายให้พอดีหน้าต่าง */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; left: 50%; top: 0; width: 1080px; height: 1920px; transform-origin: top center; background: var(--bg); }
  #content { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
  .s-logo { margin-top: 44px; font-family: Mali, sans-serif; font-weight: 700; color: var(--brand); font-size: 72px; line-height: 1; display: flex; align-items: center; gap: 20px; }
  .s-tag { margin: 12px 0 0; font-family: Mali, sans-serif; font-weight: 700; color: var(--muted); font-size: 30px; }
  .s-video { margin-top: 26px; width: 1080px; height: 608px; background: #000; position: relative; }
  .s-video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .s-new { position: absolute; left: 24px; top: 20px; background: #E5484D; color: #fff; font-family: Mali, sans-serif; font-weight: 700; font-size: 34px; padding: 8px 26px; border-radius: 999px; }
  /* ข้อ 73: ส่วนล่างแบ่ง 2 คอลัมน์ — ซ้าย: คำอวยพร + QR · ขวา: รูปจากแขกสูงเต็ม */
  #lower { position: absolute; left: 48px; right: 48px; top: 826px; display: flex; gap: 28px; }
  .s-left { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
  .s-msg { padding: 18px 26px; background: #fff; color: var(--ink); border-radius: 24px; box-sizing: border-box; }
  .s-msg b { display: inline-block; margin-bottom: 8px; background: var(--bg); color: var(--brand); font-size: 22px; padding: 2px 14px; border-radius: 999px; } /* ข้อ 75 */
  .s-msg span { font-size: 34px; line-height: 1.4; font-weight: 600; text-align: center; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-height: 143px; }
  .s-foot { display: flex; align-items: center; gap: 22px; }
  .s-qr { background: #fff; padding: 12px; border-radius: 20px; flex: 0 0 auto; }
  .s-qr svg { width: 130px; height: 130px; display: block; }
  .s-foot p { margin: 0; }
  .s-photo { flex: 0 0 440px; display: flex; flex-direction: column; gap: 10px; }
  .s-photo .pbox { flex: 1; min-height: 0; border-radius: 24px; overflow: hidden; background: #2B2622; position: relative; }
  .s-photo img { width: 100%; height: 100%; object-fit: contain; display: block; } /* ข้อ 72: เห็นครบทั้งรูป */
  .s-photo b { position: absolute; left: 12px; top: 10px; background: rgba(255,255,255,.92); color: var(--brand); font-size: 22px; padding: 2px 14px; border-radius: 999px; }
  .s-photo span { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: rgba(0,0,0,.6); color: #fff; font-size: 26px; font-weight: 600; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* ข้อ 74: คำบรรยายวางบนรูป */
  .s-start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #empty { position: absolute; left: 0; right: 0; top: 204px; height: 608px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: var(--bg); }
</style>
</head>
<body>
<div id="stage">
  <div id="content">
    <div class="s-logo">BEN <svg aria-hidden="true" width="72" height="72" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.5h2c.7-1.3 2.1-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg> MEGH</div>
    <p class="s-tag">#BMWedding · 04.12.26</p>
    <div class="s-video"><iframe id="vid" allow="autoplay; fullscreen" title="คลิปคำอวยพร"></iframe><div id="newBadge" class="s-new hidden">คำอวยพรใหม่</div></div>
  </div>
  <div id="empty" class="hidden">
    <img src="img/illustration.jpg" alt="" style="width:300px;height:300px;border-radius:50%;object-fit:cover;border:8px solid #fff">
    <p class="display brand" style="font-size:44px;margin:0">ฝากคำอวยพรได้ที่บูธ iPad</p>
  </div>
  <div id="lower">
    <div class="s-left">
      <div id="msg" class="s-msg hidden"><b>คำอวยพรจากคลิป</b><span id="msgText"></span></div>
      <div class="s-foot" id="foot" style="margin-top:auto">
        <div class="s-qr"><div id="qr" role="img" aria-label="QR อัลบั้มคำอวยพร"></div></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <p class="display brand" style="font-size:32px;line-height:1.3">สแกนดูอัลบั้ม<br>คำอวยพรบนมือถือ</p>
          <p class="muted" id="counter" style="font-size:24px;font-weight:600">คำอวยพรจากแขกในงาน</p>
        </div>
      </div>
    </div>
    <div class="s-photo hidden" id="photoBox">
      <div class="pbox"><img id="photoImg" alt="รูปจากแขก"><b>รูปจากแขก</b><span id="photoCap" class="hidden"></span></div>
    </div>
  </div>
  <div class="s-start" id="start">
    <button class="btn lg" id="btnPlay" type="button">เริ่มฉาย (กดครั้งเดียว)</button>
  </div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const C = window.APP_CONFIG || {};
  // ข้อ 67: เว้นด้านล่างให้ดอกไม้ 640px (~1/3 จอ 1920) — ปรับได้โดยเพิ่ม SCREEN_BOTTOM_SAFE ใน config.js
  const BOTTOM_SAFE = Number(C.SCREEN_BOTTOM_SAFE) >= 0 && C.SCREEN_BOTTOM_SAFE !== undefined ? Number(C.SCREEN_BOTTOM_SAFE) : 640;
  $('lower').style.height = (1920 - BOTTOM_SAFE - 24 - 826) + 'px'; // ข้อ 73
  function fit() {
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    $('stage').style.transform = 'translateX(-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  $('qr').innerHTML = App.qrSvg(App.albumUrl(), 5);
  let list = [], idx = 0, seen = new Set(), fresh = [];

  async function refresh() {
    try {
      const r = await App.apiGet({ action: 'slides' });
      if (!r.ok) return;
      r.items.forEach(it => { if (!seen.has(it.id) && list.length) fresh.push(it); seen.add(it.id); });
      list = r.items.slice(); // ข้อ 68: ใหม่สุดเป็นเลข 1 (API เรียงใหม่→เก่า)
      photos = r.photos || []; // ข้อ 70
      $('photoBox').classList.toggle('hidden', !photos.length);
      if (photos.length && !photoTimer) { nextPhoto(); photoTimer = setInterval(nextPhoto, PHOTO_SEC * 1000); }
      if (!list.length) $('empty').classList.remove('hidden');
    } catch (e) { /* เน็ตสะดุด ลองรอบหน้า */ }
  }

  function next() {
    if (!list.length) { setTimeout(next, 10000); return; }
    $('empty').classList.add('hidden');
    const isNew = fresh.length > 0;
    const it = isNew ? fresh.shift() : list[idx++ % list.length]; // คลิปใหม่แทรกคิวก่อน
    $('newBadge').classList.toggle('hidden', !isNew); // ข้อ 68
    const pos = list.findIndex(x => x.id === it.id) + 1;
    $('counter').textContent = 'คำอวยพรจากแขกในงาน · ' + pos + ' / ' + list.length;
    const m = String(it.message || '').trim();
    $('msgText').textContent = m; $('msg').classList.toggle('hidden', !m);
    // ข้อ 51: ตัวเล่น Drive (iframe) — ใช้บน Safari · ข้อ 52/55: คลิปละ SHOW_SEC วิ นับหลังตัวเล่นโหลดเสร็จ
    clearTimeout(timer);
    const f = $('vid');
    f.onload = () => { clearTimeout(timer); timer = setTimeout(next, SHOW_SEC * 1000); };
    f.src = it.previewUrl + '?autoplay=1';
    timer = setTimeout(next, LOAD_MAX_SEC * 1000);
  }
  const SHOW_SEC = 10, LOAD_MAX_SEC = 20;
  // ข้อ 70: รูปจากแขกวนในแถบเล็ก รูปละ PHOTO_SEC วิ
  const PHOTO_SEC = 6; let photos = [], pIdx = 0, photoTimer = 0;
  function nextPhoto() {
    if (!photos.length) return;
    const p = photos[pIdx++ % photos.length];
    $('photoImg').src = p.bigUrl;
    $('photoCap').textContent = p.caption || ''; $('photoCap').classList.toggle('hidden', !p.caption);
  }
  let timer = 0;

  $('btnPlay').addEventListener('click', async () => {
    $('start').classList.add('hidden');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    await refresh();
    next();
    setInterval(refresh, 20000); // ข้อ 68: ดึงรายการทุก 20 วิ (เดิม 60)
  });
})();
</script>
</body>
</html>
